; PlatformIO project for M5Stack CoreS3-SE + Base DIN + isolated Unit CAN
[env:cores3se]
platform = espressif32@7.0.1
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  m5stack/M5Unified@0.3.0
  m5stack/M5GFX@0.3.0

[env:host]
platform = windows_x86@1.2.0
build_flags = -std=gnu++11
test_build_src = no
